<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>FRED</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- Fonts are self-hosted in assets/fonts — no CDN fetch needed -->
  <!-- For adding a new icon, run the command 'npm run subset-icons' -->
  <!-- If the icon is returned through a TS function (not in the HTML), add it to DYNAMIC_ICONS at the top of scripts/subset-icons.mjs -->
  <link rel="preload" href="assets/fonts/material-symbols-outlined.woff2?v=2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Montserrat-BlackItalic.ttf" as="font" type="font/ttf" crossorigin />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <script type="module" src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.js"></script>

</head>

<body>
  <div id="app-resume-cover" style="position:fixed;inset:0;background:#ffffff;z-index:99999;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;">
    <div id="app-resume-cover-lottie" style="position:absolute;inset:0;"></div>
    <img id="app-resume-cover-fallback" src="assets/images/fred-logo.svg" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;pointer-events:none;" alt="" />
  </div>
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = 'assets/lottie/lottie-web.min.js';
      s.onload = function() {
        if (!window.lottie) return;
        var container = document.getElementById('app-resume-cover-lottie');
        var fallback = document.getElementById('app-resume-cover-fallback');
        if (!container) return;
        window.lottie.loadAnimation({
          container: container,
          path: 'assets/lottie/coin-drop.json',
          renderer: 'svg',
          loop: true,
          autoplay: true,
          rendererSettings: { preserveAspectRatio: 'xMidYMid slice' },
        });
        if (fallback) fallback.style.display = 'none';
      };
      document.head.appendChild(s);
    })();
  </script>
  <app-root></app-root>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</body>

</html>
