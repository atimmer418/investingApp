<ion-tabs class="mobile-tabs">
  <ion-tab-bar slot="bottom" class="mobile-tab-bar safe-area-bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1" class="mobile-tab-button" [disabled]="isSubExpired" [class.expired-tab]="isSubExpired">
      <ion-icon aria-hidden="true" name="pie-chart-outline" class="tab-icon"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2" class="mobile-tab-button" [disabled]="isSubExpired" [class.expired-tab]="isSubExpired">
      <ion-icon aria-hidden="true" name="trending-up-outline" class="tab-icon"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="chat" href="/tabs/chat" class="mobile-tab-button" [disabled]="isSubExpired" [class.expired-tab]="isSubExpired">
      <ion-icon aria-hidden="true" name="chatbubbles-outline" class="tab-icon"></ion-icon>
    </ion-tab-button>

    <!-- Tab 3 (My Profile) always enabled -->
    <ion-tab-button tab="tab3" href="/tabs/tab3" class="mobile-tab-button">
      <div class="tab-icon-wrap">
        <ion-icon aria-hidden="true" name="person-outline" class="tab-icon"></ion-icon>
        <ion-badge *ngIf="(settingsTabBadge$ | async)" class="tab-badge">{{ settingsTabBadge$ | async }}</ion-badge>
      </div>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
