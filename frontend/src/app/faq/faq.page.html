<ion-header class="ion-no-border safe-area-top">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button (click)="goBack()" color="dark">
                <ion-icon name="arrow-back-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Frequently Asked Questions</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="faq-content">
    <div class="mobile-container">

        <!-- Hero / Intro -->
        <div class="faq-hero">
            <div class="hero-icon">
                <ion-icon name="help-circle-outline"></ion-icon>
            </div>
            <h2>How can we help?</h2>
            <p>Find answers to common questions about your investments, taxes, and how FRED works.</p>
        </div>

        <!-- FAQ Accordion List -->
        <div class="faq-list">
            <div class="faq-card" *ngFor="let faq of faqs; let i = index" [class.active]="faq.isOpen">

                <!-- Question Header (Clickable) -->
                <div class="faq-header" (click)="toggleSection(i)">
                    <div class="question-container">
                        <div class="icon-box">
                            <ion-icon [name]="faq.icon"></ion-icon>
                        </div>
                        <h3 class="question-text">{{ faq.question }}</h3>
                    </div>

                    <div class="toggle-icon">
                        <ion-icon [name]="faq.isOpen ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
                    </div>
                </div>

                <!-- Answer Body (Expandable) -->
                <div class="faq-body" [class.expanded]="faq.isOpen">
                    <div class="answer-content">
                        <p>{{ faq.answer }}</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Contact Support Section -->
        <div class="support-section">
            <p>Still have questions?</p>
            <ion-button expand="block" fill="outline" color="primary" class="contact-btn">
                Contact Support
            </ion-button>
        </div>

    </div>
</ion-content>
