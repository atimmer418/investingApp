<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-inner">
      <button class="back-btn" (click)="goBack()">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button>
      <h2 class="header-title">Frequently Asked Questions</h2>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-inner">

    <!-- Hero -->
    <div class="faq-hero">
      <div class="hero-icon-wrap">
        <span class="material-symbols-outlined hero-icon">help</span>
      </div>
      <h2 class="hero-title">How can we help?</h2>
      <p class="hero-desc">Find answers to common questions about your investments, taxes, and how FRED works.</p>
    </div>

    <!-- FAQ Accordion -->
    <div class="faq-list">
      <div class="faq-card" *ngFor="let faq of faqs; let i = index" [class.active]="faq.isOpen">

        <div class="faq-header" (click)="toggleSection(i)">
          <div class="question-container">
            <div class="icon-box">
              <ion-icon [name]="faq.icon"></ion-icon>
            </div>
            <h3 class="question-text">{{ faq.question }}</h3>
          </div>
          <div class="toggle-icon">
            <span class="material-symbols-outlined" *ngIf="faq.isOpen">expand_less</span>
            <span class="material-symbols-outlined" *ngIf="!faq.isOpen">expand_more</span>
          </div>
        </div>

        <div class="faq-body" [class.expanded]="faq.isOpen">
          <div class="answer-content">
            <p [innerHTML]="faq.answer"></p>
          </div>
        </div>

      </div>
    </div>

    <!-- Support -->
    <div class="support-section">
      <p class="support-title">Still have questions?</p>
      <p class="support-desc">FRED can answer questions about these FAQs!<br>If you still need help, feel free to contact us.</p>
    </div>

  </div>
</ion-content>
