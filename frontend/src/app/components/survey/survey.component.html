<!-- Stock Preference Survey -->
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Investment Preferences</ion-title>
    <ion-progress-bar [value]="progressPercentage / 100"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="survey-content">
  <div class="survey-container" *ngIf="currentQuestion">
    
    <!-- Header Section -->
    <div class="header-section">
      <h1 class="page-title">{{ currentQuestion.questionText }}</h1>
      <p class="page-subtitle">Choose the option that best describes your investment preference</p>
    </div>

    <!-- Choice Options -->
    <div class="options-section">
      <div 
        class="option-card"
        *ngFor="let choice of currentQuestion.responseChoices"
        [class.selected]="isChoiceSelected(choice.id)"
        (click)="selectChoice(choice.id)">
        <div class="option-content">
          <div class="option-radio">
            <div class="radio-dot" [class.checked]="isChoiceSelected(choice.id)"></div>
          </div>
          <div class="option-text">
            <span>{{ choice.text }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Continue Button -->
    <div class="action-section">
      <ion-button 
        expand="block" 
        class="continue-button"
        [disabled]="!canProceed() || isSubmittingSurvey"
        (click)="goToNextQuestion()">
        <ion-spinner name="crescent" *ngIf="isSubmittingSurvey" slot="start"></ion-spinner>
        <span *ngIf="!isSubmittingSurvey">
          {{ currentQuestionIndex === totalQuestionsInActiveSurvey - 1 ? 'Complete Setup' : 'Continue' }}
        </span>
        <span *ngIf="isSubmittingSurvey">Setting up...</span>
      </ion-button>
    </div>

  </div>
</ion-content>
