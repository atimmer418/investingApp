<ion-menu contentId="main-content" side="end" menuId="chat-menu">
  <ion-header>
    <ion-toolbar>
      <ion-title>History</ion-title>
      <ion-buttons slot="end">
        <ion-menu-toggle menu="chat-menu" auto-hide="false">
          <ion-button (click)="startNewChat()">
            <ion-icon slot="icon-only" name="add-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-menu-toggle menu="chat-menu" auto-hide="false">
        <ion-item *ngFor="let session of sessions" (click)="loadSession(session)"
          [color]="session.id === currentSession?.id ? 'light' : ''" button detail="false">
          <ion-label>
            <h2>{{ session.title }}</h2>
            <p>{{ session.lastModified | date:'short' }}</p>
          </ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-title>Ask FRED</ion-title>
      <ion-buttons slot="end">
        <ion-menu-button menu="chat-menu">
          <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
        </ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="chat-content" appTabBarScroll tabBarNoShrink appKeyboardAvoid>
    <div class="messages-container">
      <div *ngFor="let msg of messages; let i = index" class="message-wrapper"
        [class.user-message]="msg.role === 'user'" [class.assistant-message]="msg.role === 'assistant'"
        [class.failed-message]="msg.failed" [class.empty-message]="msg.role === 'assistant' && !msg.content"
        [id]="'chat-message-' + i">

        <div class="avatar" *ngIf="msg.role === 'assistant'">
          <img src="assets/images/pig-range-4.svg" class="fred-avatar-img" alt="FRED">
        </div>

        <!-- Retry button for failed messages (before bubble) -->
        <ion-button *ngIf="msg.failed && msg.role === 'user'" size="small" fill="outline" color="danger"
          (click)="retryMessage(i)" class="retry-button-inline">
          <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <div class="message-bubble">
          <div class="message-text" [innerHTML]="formatMessage(msg.content)"></div>
          <!-- <div class="message-time">{{ msg.timestamp | date:'shortTime' }}</div> -->
        </div>

      </div>

      <div *ngIf="isEmptyState" class="empty-state">
        <img src="assets/images/pig-range-4.svg" class="empty-hero" alt="FRED piggy bank" />
        <h1 class="empty-greeting">{{ timeGreeting }}</h1>
        <p class="empty-subtitle">What are we doing today?</p>

        <div class="suggestion-cards" *ngIf="dailySuggestions.length > 0">
          <button
            class="suggestion-card"
            *ngFor="let question of dailySuggestions; let i = index"
            (click)="selectSuggestion(question)"
            [class.tour-story-chip]="isTourOnStep4 && question === FRED_STORY_TRIGGER">
            <span class="card-icon"><ion-icon [name]="suggestionIcon(i)"></ion-icon></span>
            <span class="card-text">{{ question }}</span>
          </button>
        </div>
      </div>

      <div *ngIf="isLoading" class="thinking-row">
        <img src="assets/images/pig-range-4.svg" class="thinking-pig" alt="" />
        <span class="thinking-text">{{ thinkingPhrase }}</span>
      </div>
      <div id="scroll-anchor" style="height: 1px; width: 100%;"></div>
    </div>
  </ion-content>

  <ion-footer class="ion-no-border" [class.kb-open]="keyboardOffset > 0" [style.--kb-offset.px]="keyboardOffset">
    <div class="input-bar">
      <div class="input-container">
        <ion-textarea [(ngModel)]="newMessage" placeholder="Message FRED..." autoGrow="true" rows="1"
          (keydown.enter)="$event.preventDefault(); sendMessage()" (ionInput)="onTextareaInput($event)">
        </ion-textarea>
        <ion-button shape="round" (click)="sendMessage()" [disabled]="!newMessage.trim() || isLoading"
          class="send-button">
          <ion-icon name="arrow-up" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-footer>
</div>
