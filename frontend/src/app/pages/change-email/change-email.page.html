<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/security-settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Change Email</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false" class="main-content">
  <div class="content-container">

    <!-- Update Email Address Card -->
    <ion-card class="form-card">
      <ion-card-header>
        <div class="header-content">
          <ion-card-title class="card-title">
            <ion-icon name="mail-outline" color="primary"></ion-icon>
            Update Email Address
          </ion-card-title>
          <p style="margin: 8px 0 0 0; color: #666; font-size: 0.9rem;">
            Enter your new email address below.<br>You will be asked to verify your identity.
          </p>
        </div>
      </ion-card-header>
      
      <ion-card-content>
        <!-- Current Email -->
        <div class="input-wrapper">
          <label class="input-label">Current Email</label>
          <ion-input 
            class="custom-input"
            [value]="currentEmail" 
            readonly="true">
          </ion-input>
        </div>

        <!-- New Email -->
        <div class="input-wrapper">
          <label class="input-label">New Email</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="newEmail" 
            type="email"
            placeholder="Enter new email">
          </ion-input>
        </div>

      </ion-card-content>
    </ion-card>

    <!-- Action Buttons -->
    <div class="action-buttons">
       <ion-button 
        expand="block" 
        fill="solid" 
        color="primary" 
        (click)="initiateEmailChange()"
        [disabled]="!canSave() || isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Update Email</span>
      </ion-button>
    </div>

  </div>
</ion-content>
