<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/security-settings" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Change Email</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false" class="main-content">
  <div class="content-inner">

    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">mail</span>
        <h3 class="card-title">Update Email Address</h3>
      </div>
      <p class="card-subtitle">Enter your new email address below. You will be asked to verify your identity.</p>

      <div class="form-group">
        <label class="field-label">Current Email</label>
        <ion-input class="form-input form-input--readonly" [value]="currentEmail" readonly="true"></ion-input>
      </div>

      <div class="form-group form-group--last">
        <label class="field-label">New Email</label>
        <ion-input class="form-input" [(ngModel)]="newEmail" type="email" placeholder="Enter new email"></ion-input>
      </div>
    </div>

    <button class="cta-btn" (click)="initiateEmailChange()" [disabled]="!canSave() || isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent" class="btn-spinner-sm"></ion-spinner>
      <span class="material-symbols-outlined" *ngIf="!isLoading">send</span>
      <span>{{ isLoading ? 'Sending...' : 'Update Email' }}</span>
    </button>

  </div>
</ion-content>
