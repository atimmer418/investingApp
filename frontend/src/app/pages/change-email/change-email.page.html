<ion-header class="ion-no-border">
  <div class="blue-hero-header">
    <div class="hero-nav">
      <button class="back-btn" (click)="goBack()">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button>
      <h2 class="header-title">Change Email</h2>
      <div class="back-btn-spacer"></div>
    </div>
  </div>
</ion-header>

<ion-content class="shell-content" appKeyboardAvoid>
  <div class="shell-inner">

    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">mail</span>
        <h3 class="card-title">Update Email Address</h3>
      </div>
      <p class="card-subtitle">Enter your new email address below. You will be asked to verify your identity.</p>

      <div class="form-group">
        <label class="field-label">Current Email</label>
        <input class="field-input field-input--readonly" [value]="currentEmail" readonly>
      </div>

      <div class="form-group form-group--last">
        <label class="field-label">New Email</label>
        <input class="field-input" [(ngModel)]="newEmail" type="email" placeholder="Enter new email">
      </div>
    </div>

    <button class="cta-btn" (click)="initiateEmailChange()" [disabled]="!canSave() || isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent" class="btn-spinner-sm"></ion-spinner>
      <span class="material-symbols-outlined" *ngIf="!isLoading">send</span>
      <span>{{ isLoading ? 'Sending...' : 'Update Email' }}</span>
    </button>

  </div>
</ion-content>
