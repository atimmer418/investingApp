<ion-header class="ion-no-border safe-area-top">
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>

  <!-- iOS-Style Tab Switcher (Single Item) -->
  <div class="header-tab-container">
    <div class="ios-tab-switcher">
      <button class="ios-tab-button active">
        <ion-icon name="settings-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-header>

<ion-content class="settings-content">

  <!-- Settings Sections -->
  <div class="settings-sections mobile-container">
    <div *ngFor="let section of settingSections" class="settings-group">
      <h3 class="group-header text-gray text-xs font-semibold">{{ section.title }}</h3>
      
      <div class="settings-card mobile-card">
        <div class="settings-list">
          <button 
            *ngFor="let item of section.items; let last = last" 
            class="setting-item mobile-touch-target"
            [class.last-item]="last"
            (click)="onSettingClick(item.action)">
            
            <div class="setting-icon-container">
              <ion-icon [name]="item.icon" class="setting-icon"></ion-icon>
            </div>
            
            <div class="setting-content">
              <div class="setting-main">
                <h4 class="setting-title font-medium text-dark">{{ item.title }}</h4>
                <p *ngIf="item.subtitle" class="setting-subtitle text-gray">{{ item.subtitle }}</p>
              </div>
              
              <div class="setting-trailing">
                <ion-badge 
                  *ngIf="item.badge" 
                  [color]="item.badgeColor || 'primary'" 
                  class="setting-badge">
                  {{ item.badge }}
                </ion-badge>
                <ion-icon name="chevron-forward" class="chevron-icon text-gray"></ion-icon>
              </div>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- App Version -->
  <div class="app-version mobile-container">
    <p class="version-text text-xs text-gray text-center">Version 1.0.0</p>
  </div>
</ion-content>
