<ion-header class="ion-no-border">
  <div class="custom-profile-header safe-area-top">
    <div class="header-content">
      <div class="user-details">
        <div class="avatar-badge-wrap" (click)="goToMyProfile()">
          <ion-avatar class="user-avatar">
            <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <ion-badge *ngIf="(profileActionRequired$ | async)" class="profile-badge">1</ion-badge>
        </div>
        <div class="user-text">
          <h1 class="name">My Account</h1>
          <p class="greeting">Hi, Firstname</p>
        </div>
      </div>
      <div class="header-branding"
           [class.mfu-active]="hasMfuPeriod"
           (click)="onFredLogoClick()"> FRED</div>
    </div>

    <!-- Freedom stat strip — three tiles below the user/branding row -->
    <div class="stat-strip">
      <div class="stat-tile">
        <span class="stat-label">Freedom date</span>
        <span class="stat-value">{{ statStripLoading ? '—' : freedomYear }}</span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Freedom age</span>
        <span class="stat-value">{{ statStripLoading ? '—' : freedomAge }}</span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">To go</span>
        <span class="stat-value">{{ statStripLoading ? '—' : dollarsAway }}</span>
      </div>
    </div>
  </div>
</ion-header>

<ion-content [scrollY]="false" class="settings-content">
  <div class="content-scroll">
    <!-- Blue strip continuing the header; the card overlaps onto this so its
         rounded top + first label sit on blue without crossing into ion-header -->
    <div class="header-overlap" aria-hidden="true"></div>

    <!-- Overlapping white card pulled up over the blue strip -->
    <div class="sections-card">

      <!-- Settings Sections -->
      <div *ngFor="let section of settingSections" class="settings-group">
        <h3 class="group-header">{{ section.title }}</h3>

        <div class="settings-list">
          <button
            *ngFor="let item of section.items; let last = last"
            class="setting-item"
            [class.last-item]="last"
            (click)="onSettingClick(item.action)">

            <div class="setting-icon-container">
              <ion-icon [name]="item.icon" class="setting-icon"></ion-icon>
            </div>

            <div class="setting-content">
              <div class="setting-main">
                <h4 class="setting-title">{{ item.title }}</h4>
              </div>

              <div class="setting-trailing">
                <ion-badge *ngIf="item.badge" [color]="item.badgeColor || 'primary'" class="setting-badge">
                  {{ item.badge }}
                </ion-badge>
                <ion-icon name="chevron-forward" class="chevron-icon"></ion-icon>
              </div>
            </div>
          </button>
        </div>

      </div>

    </div>

    <!-- Footer -->
    <div class="footer-content">
      <p class="footer-text">© 2026 FREDvested · v1.0.0 (Beta)</p>
    </div>
  </div>
</ion-content>
