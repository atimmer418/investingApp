<ion-header class="ion-no-border">
  <!-- iOS-Style Profile Header (Replaces Toolbar) -->
  <div class="profile-header-container safe-area-top">
    <div class="profile-card">
      <ion-avatar class="profile-avatar">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Profile" />
      </ion-avatar>
      <div class="profile-info">
        <h2 class="profile-name">Alex Doe</h2>
        <p class="profile-email">alex.doe&#64;example.com</p>
      </div>
      
      <!-- Settings Gear Icon (Visual Only) -->
      <div class="profile-actions">
        <ion-icon name="settings-outline" class="settings-icon"></ion-icon>
      </div>
    </div>
  </div>
</ion-header>

<ion-content class="settings-content">
  <!-- Settings Sections -->
  <div class="settings-sections mobile-container">
    <div *ngFor="let section of settingSections" class="settings-group">
      <h3 class="group-header text-gray text-xs font-semibold">{{ section.title }}</h3>
      
      <div class="settings-card mobile-card">
        <div class="settings-list">
          <button 
            *ngFor="let item of section.items; let last = last" 
            class="setting-item mobile-touch-target"
            [class.last-item]="last"
            (click)="onSettingClick(item.action)">
            
            <div class="setting-icon-container">
              <ion-icon [name]="item.icon" class="setting-icon"></ion-icon>
            </div>
            
            <div class="setting-content">
              <div class="setting-main">
                <h4 class="setting-title font-medium text-dark">{{ item.title }}</h4>
                <p *ngIf="item.subtitle" class="setting-subtitle text-gray">{{ item.subtitle }}</p>
              </div>
              
              <div class="setting-trailing">
                <ion-badge 
                  *ngIf="item.badge" 
                  [color]="item.badgeColor || 'primary'" 
                  class="setting-badge">
                  {{ item.badge }}
                </ion-badge>
                <ion-icon name="chevron-forward" class="chevron-icon text-gray"></ion-icon>
              </div>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout Section -->
  <!-- <div class="logout-section mobile-container">
    <button class="logout-button mobile-card mobile-touch-target" (click)="onLogout()">
      <div class="logout-content">
        <ion-icon name="log-out-outline" class="logout-icon text-danger"></ion-icon>
        <span class="logout-text text-base font-medium text-danger">Sign Out</span>
      </div>
    </button>
  </div> -->

  <!-- App Version -->
  <div class="app-version mobile-container">
    <p class="version-text text-xs text-gray text-center">Version 1.0.0</p>
  </div>
</ion-content>
