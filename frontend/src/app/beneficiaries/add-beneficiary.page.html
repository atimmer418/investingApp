<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/beneficiaries" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>
      {{ editMode ? 'Edit Beneficiary' : 'Add Beneficiary' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="main-content">
  <div class="content-container">
    
    <!-- Personal Information Card -->
    <ion-card class="form-card">
      <ion-card-header>
        <ion-card-title class="card-title">
          <ion-icon name="person-outline" color="primary"></ion-icon>
          Personal Information
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        
        <!-- Beneficiary Type -->
        <div class="input-wrapper">
          <label class="input-label">Beneficiary Type<span class="required-star">*</span></label>
          <ion-select class="custom-select" [(ngModel)]="beneficiary.beneficiaryType" placeholder="Select type" interface="action-sheet" cancelText="Cancel">
            <ion-select-option value="PRIMARY">Primary</ion-select-option>
            <ion-select-option value="CONTINGENT">Contingent</ion-select-option>
          </ion-select>
        </div>

        <!-- Name Fields -->
        <div class="input-wrapper">
          <label class="input-label">First Name<span class="required-star">*</span></label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.firstName" 
            placeholder="Enter first name"
            type="text"
            maxlength="100">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">Last Name<span class="required-star">*</span></label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.lastName" 
            placeholder="Enter last name"
            type="text"
            maxlength="100">
          </ion-input>
        </div>

        <!-- Date of Birth -->
        <div class="input-wrapper">
          <label class="input-label">Date of Birth<span class="required-star">*</span></label>
          <ion-input 
            class="custom-input"
            id="open-dob-modal"
            [value]="beneficiary.dateOfBirth | date:'mediumDate'"
            readonly="true"
            placeholder="Select date">
            <ion-icon name="calendar-outline" slot="end" color="medium"></ion-icon>
          </ion-input>
          
          <ion-modal #dobModal trigger="open-dob-modal" [keepContentsMounted]="true" style="--height: auto; --width: auto; --border-radius: 16px;">
            <ng-template>
              <ion-datetime 
                #datetime
                presentation="date"
                [(ngModel)]="beneficiary.dateOfBirth"
                [max]="today"
                color="primary"
                style="height: auto; max-width: 350px;">
                <span slot="title">Select Date of Birth</span>
                <ion-buttons slot="buttons">
                  <ion-button color="primary" (click)="datetime.confirm(); dobModal.dismiss()">Done</ion-button>
                </ion-buttons>
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </div>

        <!-- Social Security Number -->
        <div class="input-wrapper">
          <label class="input-label">Social Security Number<span class="required-star">*</span></label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.socialSecurityNumber" 
            placeholder="XXX-XX-XXXX"
            type="text"
            maxlength="11"
            (ionInput)="formatSSN($event)">
          </ion-input>
        </div>

        <!-- Relationship -->
        <div class="input-wrapper">
          <label class="input-label">Relationship<span class="required-star">*</span></label>
          <ion-select class="custom-select" [(ngModel)]="beneficiary.relationship" placeholder="Select relationship" interface="action-sheet" cancelText="Cancel">
            <ion-select-option 
              *ngFor="let option of relationshipOptions" 
              [value]="option.value">
              {{ option.label }}
            </ion-select-option>
          </ion-select>
        </div>

        <!-- Allocation Percentage -->
        <div class="input-wrapper">
          <label class="input-label">Allocation Percentage<span class="required-star">*</span></label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.percentageAllocation" 
            placeholder="0.00"
            type="number"
            min="0.01"
            max="100"
            step="0.01">
          </ion-input>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Contact Information Card -->
    <ion-card class="form-card">
      <ion-card-header>
        <ion-card-title class="card-title">
          <ion-icon name="mail-outline" color="primary"></ion-icon>
          Contact Information
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        
        <div class="input-wrapper">
          <label class="input-label">Email</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.email" 
            placeholder="email@example.com"
            type="email"
            maxlength="255">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">Phone Number</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.phone" 
            placeholder="(555) 123-4567"
            type="tel"
            maxlength="14"
            (ionInput)="formatPhone($event)">
          </ion-input>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Address Information Card -->
    <ion-card class="form-card">
      <ion-card-header>
        <ion-card-title class="card-title">
          <ion-icon name="location-outline" color="primary"></ion-icon>
          Address Information
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        
        <div class="input-wrapper">
          <label class="input-label">Address Line 1</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.addressLine1"  
            placeholder="123 Main Street"
            type="text"
            maxlength="255">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">Address Line 2</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.addressLine2" 
            placeholder="Apt 123"
            type="text"
            maxlength="255">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">City</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.city" 
            placeholder="New York"
            type="text"
            maxlength="100">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">State</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.state" 
            placeholder="NY"
            type="text"
            maxlength="2">
          </ion-input>
        </div>

        <div class="input-wrapper">
          <label class="input-label">ZIP Code</label>
          <ion-input 
            class="custom-input"
            [(ngModel)]="beneficiary.postalCode" 
            placeholder="12345"
            type="text"
            maxlength="10">
          </ion-input>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <ion-button 
        expand="block" 
        fill="solid" 
        color="primary" 
        (click)="onSave()"
        [disabled]="isLoading || !isFormComplete">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ editMode ? 'Update Beneficiary' : 'Add Beneficiary' }}
      </ion-button>

      <!-- <ion-button 
        expand="block" 
        fill="outline" 
        color="medium" 
        (click)="onCancel()"
        [disabled]="isLoading">
        Cancel
      </ion-button> -->
    </div>

  </div>

</ion-content>
