<ion-header class="ion-no-border">
  <div class="blue-hero-header">
    <div class="hero-nav">
      <button class="back-btn" (click)="goBack()">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button>
      <h2 class="header-title">{{ editMode ? 'Edit Beneficiary' : 'Add Beneficiary' }}</h2>
      <div class="back-btn-spacer"></div>
    </div>
  </div>
</ion-header>

<ion-content class="main-content" appKeyboardAvoid>
  <div class="content-inner">

    <!-- Personal Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">person</span>
        <h3 class="card-title">Personal Information</h3>
      </div>

      <div class="form-group">
        <p class="field-label">Beneficiary Type<span class="required-star">*</span></p>
        <div class="select-wrapper">
          <select class="field-select" [(ngModel)]="beneficiary.beneficiaryType">
            <option value="" disabled>Select type</option>
            <option value="PRIMARY">Primary</option>
            <option value="CONTINGENT">Contingent</option>
          </select>
          <span class="select-arrow material-symbols-outlined">expand_more</span>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">First Name<span class="required-star">*</span></label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.firstName"
          placeholder="Enter first name"
          type="text"
          maxlength="100">
      </div>

      <div class="form-group">
        <label class="field-label">Last Name<span class="required-star">*</span></label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.lastName"
          placeholder="Enter last name"
          type="text"
          maxlength="100">
      </div>

      <div class="form-group">
        <label class="field-label">Date of Birth<span class="required-star">*</span></label>
        <input
          class="field-input field-input--readonly"
          id="open-dob-modal"
          [value]="beneficiary.dateOfBirth ? (beneficiary.dateOfBirth | date:'mediumDate') : ''"
          readonly
          placeholder="Select date">

        <ion-modal #dobModal trigger="open-dob-modal" [keepContentsMounted]="true" style="--height: auto; --width: auto; --border-radius: 16px;">
          <ng-template>
            <ion-datetime
              #datetime
              presentation="date"
              [(ngModel)]="beneficiary.dateOfBirth"
              [max]="today"
              color="primary"
              style="height: auto; max-width: 350px;">
              <span slot="title">Select Date of Birth</span>
              <ion-buttons slot="buttons">
                <ion-button color="primary" (click)="datetime.confirm(); dobModal.dismiss()">Done</ion-button>
              </ion-buttons>
            </ion-datetime>
          </ng-template>
        </ion-modal>
      </div>

      <div class="form-group">
        <label class="field-label">Social Security Number<span class="required-star">*</span></label>
        <input
          class="field-input"
          [value]="beneficiary.socialSecurityNumber || ''"
          placeholder="XXX-XX-XXXX"
          type="text"
          maxlength="11"
          (input)="formatSSN($event)">
      </div>

      <div class="form-group">
        <p class="field-label">Relationship<span class="required-star">*</span></p>
        <div class="select-wrapper">
          <select class="field-select" [(ngModel)]="beneficiary.relationship">
            <option value="" disabled>Select relationship</option>
            <option *ngFor="let option of relationshipOptions" [value]="option.value">{{ option.label }}</option>
          </select>
          <span class="select-arrow material-symbols-outlined">expand_more</span>
        </div>
      </div>

      <div class="form-group form-group--last">
        <label class="field-label">Allocation Percentage<span class="required-star">*</span></label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.percentageAllocation"
          placeholder="0.00"
          type="number"
          min="0.01"
          max="100"
          step="0.01">
      </div>
    </div>

    <!-- Contact Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">mail</span>
        <h3 class="card-title">Contact Information</h3>
      </div>

      <div class="form-group">
        <label class="field-label">Email</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.email"
          placeholder="email@example.com"
          type="email"
          maxlength="255">
      </div>

      <div class="form-group form-group--last">
        <label class="field-label">Phone Number</label>
        <input
          class="field-input"
          [value]="beneficiary.phone || ''"
          placeholder="(555) 123-4567"
          type="tel"
          maxlength="14"
          (input)="formatPhone($event)">
      </div>
    </div>

    <!-- Address Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">location_on</span>
        <h3 class="card-title">Address Information</h3>
      </div>

      <div class="form-group">
        <label class="field-label">Address Line 1</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.addressLine1"
          placeholder="123 Main Street"
          type="text"
          maxlength="255">
      </div>

      <div class="form-group">
        <label class="field-label">Address Line 2</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.addressLine2"
          placeholder="Apt 123"
          type="text"
          maxlength="255">
      </div>

      <div class="form-group">
        <label class="field-label">City</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.city"
          placeholder="New York"
          type="text"
          maxlength="100">
      </div>

      <div class="form-row">
        <div class="form-group form-group--last">
          <label class="field-label">State</label>
          <input
            class="field-input"
            [(ngModel)]="beneficiary.state"
            placeholder="NY"
            type="text"
            maxlength="2">
        </div>
        <div class="form-group form-group--last">
          <label class="field-label">ZIP Code</label>
          <input
            class="field-input"
            [(ngModel)]="beneficiary.postalCode"
            placeholder="12345"
            type="text"
            maxlength="10">
        </div>
      </div>
    </div>

    <!-- Save -->
    <button class="cta-btn" (click)="onSave()" [disabled]="isLoading || !isFormComplete">
      <span class="material-symbols-outlined">save</span>
      {{ editMode ? 'Update Beneficiary' : 'Add Beneficiary' }}
    </button>

  </div>
</ion-content>
