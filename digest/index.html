<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Daily Digest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #22263a;
      --border: #2a2e42;
      --text: #e8eaf0;
      --text-muted: #7c82a0;
      --accent-releases: #5b8df6;
      --accent-platform: #56c4a0;
      --accent-x: #1da1f2;
      --accent-releases-bg: rgba(91, 141, 246, 0.08);
      --accent-platform-bg: rgba(86, 196, 160, 0.08);
      --accent-x-bg: rgba(29, 161, 242, 0.08);
      --tag-bg: #2a2e42;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 48px 24px 80px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      body { padding: 28px 16px 60px; font-size: 14px; }
      h1 { font-size: 22px; }
      .card-item { padding: 12px 14px; }
      .section { margin-bottom: 24px; }
      .divider { margin: 24px 0; }
      header { margin-bottom: 28px; }
    }

    header {
      margin-bottom: 40px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .wordmark-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #5b8df6, #a07cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .wordmark-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .date-badge {
      display: inline-block;
      font-size: 13px;
      color: var(--text-muted);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-icon {
      font-size: 16px;
      line-height: 1;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-count {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: var(--text-muted);
      margin-left: auto;
    }

    .card {
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .card-item:last-child {
      border-bottom: none;
    }

    .card-item.releases { background: var(--accent-releases-bg); }
    .card-item.platform { background: var(--accent-platform-bg); }
    .card-item.x-post  { background: var(--accent-x-bg); }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .version-tag {
      font-size: 12px;
      font-weight: 700;
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      color: var(--accent-releases);
    }

    .item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .item-handle {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-x);
    }

    .item-body {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    .item-body a {
      color: var(--accent-releases);
      text-decoration: none;
    }

    .item-body a:hover {
      text-decoration: underline;
    }

    .platform-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-platform);
    }

    .empty-state {
      padding: 20px 18px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #56c4a0;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="wordmark">
        <div class="wordmark-icon">🤖</div>
        <span class="wordmark-text">Claude Daily Digest</span>
      </div>
      <h1 id="digest-headline">No digest yet</h1>
      <span class="date-badge" id="digest-date">Waiting for first run — check back after 8 AM ET</span>
    </header>

    <div class="divider"></div>

    <section class="section" id="section-releases">
      <div class="section-header">
        <span class="section-icon">📦</span>
        <span class="section-title">New Releases</span>
        <span class="section-count" id="count-releases">—</span>
      </div>
      <div class="card" id="releases-list">
        <div class="empty-state">No data yet — runs daily at 8 AM ET.</div>
      </div>
    </section>

    <section class="section" id="section-platform">
      <div class="section-header">
        <span class="section-icon">🔧</span>
        <span class="section-title">Platform &amp; API Updates</span>
        <span class="section-count" id="count-platform">—</span>
      </div>
      <div class="card" id="platform-list">
        <div class="empty-state">No data yet.</div>
      </div>
    </section>

    <section class="section" id="section-x">
      <div class="section-header">
        <span class="section-icon">𝕏</span>
        <span class="section-title">From the Team</span>
        <span class="section-count" id="count-x">—</span>
      </div>
      <div class="card" id="x-list">
        <div class="empty-state">No data yet.</div>
      </div>
    </section>

    <div class="divider"></div>

    <footer>
      <span><span class="status-dot"></span>digest.fredvested.com</span>
      <span id="footer-generated">Not yet generated</span>
    </footer>
  </div>
</body>
</html>
